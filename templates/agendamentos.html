
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento - Âmbar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #003b39, #01524e, #7bb6a9);
            color: white;
            font-family: Arial, sans-serif;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            width: 85px;
        }

        .sair {
            color: white;
            text-decoration: none;
            border: 1px solid #d99a2b;
            padding: 9px 18px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .sair:hover {
            background: #d99a2b;
            color: #003b39;
        }

        .conteudo {
            max-width: 580px;
            margin: 45px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h1 span {
            color: #f0c36a;
        }

        .subtitulo {
            text-align: center;
            color: #e3eeeb;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .card {
            background: #b3eade;
            color: #003b39;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(217, 154, 43, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            color: #004f4b;
        }

        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #b9e0d1;
            border-radius: 9px;
            background: rgb(164, 231, 211);
            color: #003b39;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        select:focus {
            border-color: #d99a2b;
            box-shadow: 0 0 0 2px rgba(217, 154, 43, 0.15);
        }

        .lista-servicos {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .servico-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 14px;
            border: 1px solid #d9e2dc;
            border-radius: 9px;
            background: rgb(155, 228, 217);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .servico-item:has(input:checked) {
            border-color: #d99a2b;
            background: #fffaf0;
        }

        .servico-item input {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: #d99a2b;
            cursor: pointer;
            flex-shrink: 0;
        }

        .servico-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .servico-nome {
            font-weight: normal;
            color: #003b39;
        }

        .servico-preco {
            color: #a77a25;
            font-weight: bold;
            white-space: nowrap;
        }

        .instrucao {
            display: block;
            margin-top: 10px;
            color: #647572;
            font-size: 13px;
            line-height: 1.5;
        }

        .total {
            margin-top: 22px;
            padding: 16px;
            border-radius: 9px;
            background: #edf3ef;
            border: 1px solid rgba(217, 154, 43, 0.5);
            text-align: center;
            font-size: 19px;
            font-weight: bold;
        }

        .total span {
            color: #a77a25;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #004f4b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d99a2b;
            color: #003b39;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .voltar:hover {
            color: #f0c36a;
        }

        @media (max-width: 480px) {
            .topo {
                padding: 18px 20px;
            }

            .conteudo {
                margin: 25px auto;
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }

            .servico-info {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="topo">

        <img
            src="{{ url_for('static', filename='logo.png') }}"
            class="logo"
            alt="Logo Âmbar"
        >

        <a href="/logout" class="sair">Sair</a>

    </div>

    <div class="conteudo">

        <h1>Agende seu <span>horário</span></h1>

        <p class="subtitulo">
            Escolha os serviços, profissional, data e horário.
        </p>

        <div class="card">

            <form method="POST">

                <label>💅 Serviços</label>

                <div class="lista-servicos">

                    {% for servico in servicos %}

                    <label class="servico-item">

                        <input
                            type="checkbox"
                            name="id_servicos"
                            value="{{ servico[0] }}"
                            data-preco="{{ servico[3] }}"
                        >

                        <span class="servico-info">

                            <span class="servico-nome">
                                {{ servico[1] }}
                            </span>

                            <span class="servico-preco">
                                R$ {{ "%.2f"|format(servico[3]) }}
                            </span>

                        </span>

                    </label>

                    {% endfor %}

                </div>

                <small class="instrucao">
                    Marque as caixinhas dos serviços que deseja realizar.
                    Você pode escolher mais de um.
                </small>

                <div class="total">
                    Total: R$ <span id="valor-total">0,00</span>
                </div>

                <label for="funcionario">👩‍💼 Profissional</label>

                <select name="id_funcionario" id="funcionario" required>

                    <option value="">Selecione o profissional</option>

                    {% for funcionario in funcionarios %}

                    <option value="{{ funcionario[0] }}">
                        {{ funcionario[1] }}
                    </option>

                    {% endfor %}

                </select>

                <label for="data">📅 Data</label>

                <select name="data" id="data" required>

                    <option value="">
                        Selecione primeiro o profissional
                    </option>

                </select>

                <label for="horario">🕐 Horário</label>

                <select name="horario" id="horario" required>

                    <option value="">
                        Selecione primeiro a data
                    </option>

                </select>

                <button type="submit">
                    Confirmar agendamento ✨
                </button>

            </form>

        </div>

        <a href="/painel" class="voltar">
            ← Voltar para o painel
        </a>

    </div>

    <script>
        const servicos = document.querySelectorAll(
            'input[name="id_servicos"]'
        );

        const valorTotal = document.getElementById("valor-total");

        function calcularTotal() {

            let total = 0;

            servicos.forEach(function (servico) {

                if (servico.checked) {
                    total += parseFloat(servico.dataset.preco);
                }

            });

            valorTotal.textContent = total.toFixed(2).replace(".", ",");

        }

        servicos.forEach(function (servico) {
            servico.addEventListener("change", calcularTotal);
        });

        const funcionario = document.getElementById("funcionario");
        const data = document.getElementById("data");
        const horario = document.getElementById("horario");

        funcionario.onchange = function () {

            horario.innerHTML =
                "<option value=''>Selecione primeiro a data</option>";

            if (!this.value) {

                data.innerHTML =
                    "<option value=''>Selecione primeiro o profissional</option>";

                return;
            }

            data.innerHTML =
                "<option value=''>Carregando datas...</option>";

            fetch(`/disponibilidade/${this.value}`)
                .then(r => r.json())
                .then(dados => {

                    data.innerHTML =
                        "<option value=''>Selecione a data</option>";

                    dados.forEach(d => {

                        data.innerHTML +=
                            `<option value="${d.data}">${d.data}</option>`;

                    });

                });

        };

        data.onchange = function () {

            if (!this.value) {

                horario.innerHTML =
                    "<option value=''>Selecione primeiro a data</option>";

                return;
            }

            horario.innerHTML =
                "<option value=''>Carregando horários...</option>";

            fetch(`/horarios-disponiveis/${funcionario.value}/${this.value}`)
                .then(r => r.json())
                .then(dados => {

                    horario.innerHTML =
                        "<option value=''>Selecione o horário</option>";

                    dados.forEach(h => {

                        horario.innerHTML +=
                            `<option value="${h}">${h}</option>`;

                    });

                });

        };

        document.querySelector("form").addEventListener("submit", function(event) {

            if (!document.querySelector('input[name="id_servicos"]:checked')) {
                event.preventDefault();
                alert("Selecione pelo menos um serviço.");
                return;
            }

            if (!funcionario.value || !data.value || !horario.value) {
                event.preventDefault();
                alert("Selecione o profissional, a data e o horário.");
            }

        });
    </script>

</body>

</html>
