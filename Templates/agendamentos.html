<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento - Âmbar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #075040;
            color: white;
            font-family: Arial, sans-serif;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: #003b39;
        }

        .logo {
            width: 70px;
        }

        .sair {
            color: white;
            text-decoration: none;
            border: 1px solid #d99a2b;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .conteudo {
            max-width: 550px;
            margin: 45px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
        }

        h1 span {
            color: #f0a52b;
        }

        .subtitulo {
            text-align: center;
            color: #d9e8e6;
            margin-bottom: 30px;
        }

        .card {
            background: #003b39;
            padding: 30px;
            border-radius: 18px;
            border: 1px solid #d99a2b;
            box-shadow: 0 8px 25px #0004;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #527873;
            border-radius: 9px;
            background: #053b2b;
            color: white;
            font-size: 15px;
        }

        .servicos {
            min-height: 120px;
        }

        .total {
            margin-top: 20px;
            padding: 15px;
            border-radius: 9px;
            background: #075040;
            border: 1px solid #d99a2b;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .total span {
            color: #f0a52b;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #d99a2b;
            color: #003b39;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f0a52b;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: white;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="topo">

        <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

        <a href="/logout" class="sair">Sair</a>

    </div>


    <div class="conteudo">

        <h1>Agende seu <span>horário</span></h1>

        <p class="subtitulo">
            Escolha os serviços, profissional, data e horário.
        </p>


        <div class="card">

            <form method="POST">

                <label>💅 Serviços</label>

                <select name="id_servico" id="servicos" class="servicos" multiple required>

                    {% for servico in servicos %}

                        <option value="{{ servico[0] }}" data-preco="{{ servico[3] }}">
                            {{ servico[1] }} - R$ {{ "%.2f"|format(servico[3]) }}
                        </option>

                    {% endfor %}

                </select>

                <small>
                    Segure CTRL para selecionar mais de um serviço.
                </small>


                <div class="total">
                    Total: R$ <span id="valor-total">0,00</span>
                </div>


                <label>👩‍💼 Profissional</label>

                <select name="id_funcionario" id="funcionario" required>

                    <option value="">Selecione o profissional</option>

                    {% for funcionario in funcionarios %}

                        <option value="{{ funcionario[0] }}">
                            {{ funcionario[1] }}
                        </option>

                    {% endfor %}

                </select>


                <label>📅 Data</label>

                <select name="data" id="data" required>

                    <option value="">
                        Selecione primeiro o profissional
                    </option>

                </select>


                <label>🕐 Horário</label>

                <select name="horario" id="horario" required>

                    <option value="">
                        Selecione primeiro a data
                    </option>

                </select>


                <button type="submit">
                    Confirmar agendamento ✨
                </button>

            </form>

        </div>


        <a href="/painel" class="voltar">
            ← Voltar para o painel
        </a>

    </div>


    <script>

        const servicos = document.getElementById("servicos");
        const valorTotal = document.getElementById("valor-total");

        servicos.addEventListener("change", function () {

            let total = 0;

            Array.from(this.selectedOptions).forEach(option => {

                total += parseFloat(option.dataset.preco);

            });

            valorTotal.textContent = total.toFixed(2).replace(".", ",");

        });


        const funcionario = document.getElementById("funcionario");
        const data = document.getElementById("data");
        const horario = document.getElementById("horario");


        funcionario.onchange = function () {

            data.innerHTML = "<option>Carregando datas...</option>";
            horario.innerHTML = "<option>Selecione primeiro a data</option>";

            fetch(`/disponibilidade/${this.value}`)
                .then(r => r.json())
                .then(dados => {

                    data.innerHTML = "<option value=''>Selecione a data</option>";

                    dados.forEach(d => {

                        data.innerHTML +=
                            `<option value="${d.data}">${d.data}</option>`;

                    });

                });

        };


        data.onchange = function () {

            horario.innerHTML = "<option>Carregando horários...</option>";

            fetch(`/horarios-disponiveis/${funcionario.value}/${this.value}`)
                .then(r => r.json())
                .then(dados => {

                    horario.innerHTML =
                        "<option value=''>Selecione o horário</option>";

                    dados.forEach(h => {

                        horario.innerHTML +=
                            `<option value="${h}">${h}</option>`;

                    });

                });

        };

    </script>

</body>

</html>
