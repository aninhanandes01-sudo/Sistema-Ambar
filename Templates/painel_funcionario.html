
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Âmbar - Painel do Funcionário</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                110deg,
                #003b39 0%,
                #01524e 48%,
                #7bb6a9 100%
            );
            color: #003b39;
            font-family: Arial, sans-serif;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            width: 100px;
        }

        .topo-direita {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .perfil,
        .sair {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .perfil:hover,
        .sair:hover {
            color: #f0a52b;
        }

        .conteudo {
            max-width: 950px;
            margin: 55px auto 0;
            padding: 0 20px;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 12px;
        }

        h1 span {
            color: #f0a52b;
        }

        .subtitulo {
            color: #e1eeea;
            margin-bottom: 45px;
            font-size: 16px;
            line-height: 1.7;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .botao {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 175px;
            padding: 28px 22px;

            background: #f8f7f1;
            border: 1px solid rgba(217, 154, 43, 0.55);
            color: #003b39;

            border-radius: 13px;
            text-decoration: none;

            box-shadow: 0 5px 18px rgba(0, 30, 28, 0.12);

            transition: 0.25s ease;
        }

        .botao:hover {
            background: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 30, 28, 0.18);
            border-color: #d99a2b;
        }

        .icone {
            width: 38px;
            height: 3px;
            background: #d99a2b;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .titulo-botao {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 9px;
        }

        .descricao {
            color: #71817a;
            font-size: 13px;
            line-height: 1.6;
        }

        .rodape {
            margin-top: 45px;
            padding-bottom: 25px;
            color: #e1eeea;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .topo {
                padding: 18px 20px;
            }

            .logo {
                width: 80px;
            }

            .topo-direita {
                gap: 18px;
            }

            .conteudo {
                margin-top: 35px;
            }

            .menu {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 26px;
            }

            .subtitulo {
                font-size: 14px;
                margin-bottom: 30px;
            }

            .botao {
                min-height: 150px;
            }

        }

    </style>

</head>

<body>

    <div class="topo">

        <img
            src="{{ url_for('static', filename='logo.png') }}"
            class="logo"
            alt="Logo Âmbar"
        >

        <div class="topo-direita">

            <a href="/perfil" class="perfil">
                Perfil
            </a>

            <a href="/logout" class="sair">
                Sair
            </a>

        </div>

    </div>

    <div class="conteudo">

        <h1>
            Olá, <span>{{ session["usuario_nome"] }}</span>!
        </h1>

        <p class="subtitulo">
            Bem-vindo ao seu painel Âmbar.<br>
            O que você deseja fazer hoje?
        </p>

        <div class="menu">

            <a href="/minha-agenda" class="botao">

                <div class="icone"></div>

                <div class="titulo-botao">
                    Minha agenda
                </div>

                <div class="descricao">
                    Defina seus dias e horários disponíveis
                </div>

            </a>

            <a href="/meus-agendamentos" class="botao">

                <div class="icone"></div>

                <div class="titulo-botao">
                    Meus agendamentos
                </div>

                <div class="descricao">
                    Consulte seus atendimentos
                </div>

            </a>

        </div>

        <div class="rodape">
            Sistema Âmbar • Seu cuidado começa aqui
        </div>

    </div>

</body>

</html>
